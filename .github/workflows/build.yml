name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: 'সমিতির ওয়েবসাইট (খালি রাখলে অ্যাপ প্রথমবার জিজ্ঞেস করবে)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Build APK
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --dart-define=PAYRA_SITE="$SITE" 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: payra-society-android
          path: build/app/outputs/flutter-apk/*-release.apk

      # Every build on main becomes a release, so the newest APK is always at
      # https://github.com/iamsaifsaiful/payra_society/releases/latest/download/payra-society.apk
      # (the same link can go in the plugin's app settings as apk_url).
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ github.event.inputs.site }}
        run: |
          # Almost every phone from the last 7 years is arm64; older 32-bit phones use the armv7 file.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk payra-society.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk payra-society-armv7.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="v${VERSION}-build.${{ github.run_number }}"
          NOTE="পায়রা সমিতি অ্যাপ ${VERSION} (build ${{ github.run_number }}) · commit ${GITHUB_SHA::7}. বেশিরভাগ ফোনে payra-society.apk; খুব পুরনো ফোনে ইনস্টল না হলে payra-society-armv7.apk।"
          if [ -n "$SITE" ]; then NOTE="$NOTE · ওয়েবসাইট বসানো: $SITE"; fi
          gh release create "$TAG" payra-society.apk payra-society-armv7.apk --title "পায়রা সমিতি $VERSION (build ${{ github.run_number }})" --notes "$NOTE" --latest
