name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: 'সমিতির ওয়েবসাইট (খালি রাখলে অ্যাপ প্রথমবার জিজ্ঞেস করবে)'
        required: false
        default: ''

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: bash tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log || { bash tool/annotate_failures.sh analyze.log "Analyze failed"; exit 1; }

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log || { bash tool/annotate_failures.sh test.log "Tests failed"; exit 1; }

      - name: Build APK
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=PAYRA_SITE="$SITE" 2>&1 | tee build.log || { bash tool/annotate_failures.sh build.log "Build failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: payra-society-android
          path: build/app/outputs/flutter-apk/app-release.apk
