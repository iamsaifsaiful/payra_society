name: payra_society
description: পায়রা সমিতির সদস্য ও অ্যাডমিন অ্যাপ — সঞ্চয়, বিনিয়োগ, লাভ ও রসিদ (Payra Enterprise Society Accounts প্লাগিনের API দিয়ে চলে)।
publish_to: 'none'
version: 1.2.1+5

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Noto Sans Bengali: clear, standard Bengali digits (৪/৮, ৩/৯ easy to tell apart).
    - family: Noto
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
